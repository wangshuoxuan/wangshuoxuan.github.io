app_title: 王烁瑄 · 内容管理
backend:
  name: github
  repo: wangshuoxuan/wangshuoxuan.github.io
  branch: main
  auth_methods:
  - token
site_url: https://wangshuoxuan.github.io/
display_url: https://wangshuoxuan.github.io/
media_folder: docs/assets
public_folder: /assets
collections:
- name: site
  label: 首页与个人介绍
  files:
  - name: site
    label: 首页与个人介绍
    file: content/site.json
    fields:
    - name: name_zh
      label: 中文姓名
      widget: string
      required: true
    - name: name_en
      label: 英文姓名
      widget: string
      required: true
    - name: zh
      label: 中文首页
      widget: object
      required: false
      fields:
      - name: identity
        label: 身份说明
        widget: string
        required: false
      - name: lead
        label: 首页大字介绍
        widget: text
        required: false
      - name: introduction
        label: 个人简介
        widget: richtext
        required: false
        format: html
        modes:
        - rich_text
      - name: research_summary
        label: 研究兴趣
        widget: text
        required: false
      - name: disciplines
        label: 学科兴趣
        widget: list
        required: false
        field:
          name: interest
          label: 学科
          widget: string
          required: false
      - name: hobbies
        label: 兴趣爱好
        widget: list
        required: false
        field:
          name: hobby
          label: 爱好
          widget: string
          required: false
      - name: education
        label: 学业经历（每项一行）
        widget: list
        required: false
        field:
          name: item
          label: 内容
          widget: string
      - name: honors
        label: 所获荣誉（每项一行）
        widget: list
        required: false
        field:
          name: item
          label: 内容
          widget: string
    - name: en
      label: 英文首页
      widget: object
      required: false
      fields:
      - name: identity
        label: 身份说明
        widget: string
        required: false
      - name: lead
        label: 首页大字介绍
        widget: text
        required: false
      - name: introduction
        label: 个人简介
        widget: richtext
        required: false
        format: html
        modes:
        - rich_text
      - name: research_summary
        label: 研究兴趣
        widget: text
        required: false
      - name: disciplines
        label: 学科兴趣
        widget: list
        required: false
        field:
          name: interest
          label: 学科
          widget: string
          required: false
      - name: hobbies
        label: 兴趣爱好
        widget: list
        required: false
        field:
          name: hobby
          label: 爱好
          widget: string
          required: false
      - name: education
        label: 学业经历（每项一行）
        widget: list
        required: false
        field:
          name: item
          label: 内容
          widget: string
      - name: honors
        label: 所获荣誉（每项一行）
        widget: list
        required: false
        field:
          name: item
          label: 内容
          widget: string
    - name: avatar
      label: 个人头像
      widget: image
      required: false
- name: contact
  label: 联系方式 · 填写格子
  files:
  - name: contact
    label: 联系方式（空项不公开）
    file: content/contact.json
    fields:
    - name: intro
      label: 联系说明
      widget: object
      required: false
      fields:
      - name: zh
        label: 中文说明
        widget: text
        required: false
      - name: en
        label: 英文说明
        widget: text
        required: false
    - name: routes
      label: 按交流用途填写
      widget: list
      required: false
      collapsed: false
      summary: '{{fields.name.zh}}'
      hint: 邮箱与表单链接可任选其一；两项均为空则不展示。表单链接需填写你已有的外部表单地址。
      fields:
      - name: name
        label: 用途名称
        widget: object
        required: false
        fields:
        - name: zh
          label: 中文
          widget: string
          required: false
        - name: en
          label: 英文（可留空）
          widget: string
          required: false
      - name: description
        label: 简短说明
        widget: object
        required: false
        fields:
        - name: zh
          label: 中文
          widget: string
          required: false
        - name: en
          label: 英文（可留空）
          widget: string
          required: false
      - name: email
        label: 用于这个用途的邮箱
        widget: string
        required: false
      - name: form_url
        label: 联系表单网址（可留空）
        widget: string
        required: false
        pattern:
        - ^https?://.+
        - 请输入完整表单网址
    - name: socials
      label: 社交平台与账号
      widget: list
      required: false
      collapsed: false
      summary: '{{fields.name}}'
      hint: 填写想公开的账号或主页链接；空格子不显示。
      fields:
      - name: name
        label: 平台名称
        widget: string
        required: false
      - name: value
        label: 账号 / 显示文字
        widget: string
        required: false
      - name: url
        label: 主页链接（可留空）
        widget: string
        required: false
        pattern:
        - ^https?://.+
        - 请输入完整主页网址
    - name: first_message
      label: 如何开始联系
      widget: object
      required: false
      fields:
      - name: zh
        label: 中文
        widget: text
      - name: en
        label: 英文
        widget: text
        required: false
- name: posts
  label: 我的博客
  label_singular: 文章
  folder: content/posts
  create: true
  extension: md
  format: yaml-frontmatter
  slug: '{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
  summary: '{{title}}'
  fields:
  - name: title
    label: 文章标题
    widget: string
    required: true
  - name: date
    label: 发布日期
    widget: datetime
    required: true
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - name: summary
    label: 文章摘要
    widget: text
    required: true
  - name: category
    label: 文章分类
    widget: select
    required: true
    default: essay
    options:
    - value: research
      label: 研究笔记
    - value: essay
      label: 随笔
    - value: reading
      label: 阅读札记
    - value: other
      label: 其他写作
  - name: lang
    label: 文章语言
    widget: select
    required: false
    default: zh
    options:
    - value: zh
      label: 中文
    - value: en
      label: 英文
  - name: draft
    label: 暂存草稿，不显示到网站
    widget: boolean
    required: false
    default: true
    hint: 保存为草稿仍会写入公开仓库，不适合存放私密内容。
  - name: body
    label: 正文
    widget: richtext
    required: false
    format: markdown
    modes:
    - rich_text
- name: books
  label: 书籍
  files:
  - name: books
    label: 书籍
    file: content/books.json
    fields:
    - name: categories
      widget: hidden
      default:
      - id: computing
        name:
          zh: 计算机与人工智能
          en: Computing & AI
        description:
          zh: 计算理论、算法、人工智能与计算系统。
          en: ''
      - id: electronics
        name:
          zh: 微电子与半导体
          en: Microelectronics
        description:
          zh: 器件物理、集成电路、芯片与产业。
          en: ''
      - id: math
        name:
          zh: 数学与统计
          en: Mathematics & statistics
        description:
          zh: 数学方法、概率、统计与因果推断。
          en: ''
      - id: physics
        name:
          zh: 物理与自然科学
          en: Physics & natural science
        description:
          zh: 物理、生物、复杂系统与科学方法。
          en: ''
      - id: economics
        name:
          zh: 经济与金融
          en: Economics & finance
        description:
          zh: 微观、宏观、经济史与金融。
          en: ''
      - id: history
        name:
          zh: 历史与传记
