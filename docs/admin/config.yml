app_title: 王烁瑄 · 内容管理
backend:
  name: github
  repo: wangshuoxuan/wangshuoxuan.github.io
  branch: main
  auth_methods:
  - token
site_url: https://wangshuoxuan.github.io/
display_url: https://wangshuoxuan.github.io/
media_folder: docs/assets
public_folder: /assets
collections:
- name: site
  label: 首页简介与联系方式
  files:
  - name: site
    label: 首页简介与联系方式
    file: content/site.json
    fields:
    - name: name_zh
      label: 中文姓名
      widget: string
      required: true
    - name: name_en
      label: 英文姓名
      widget: string
      required: true
    - name: email
      label: 公开邮箱
      widget: string
      required: true
    - name: github
      label: GitHub 主页链接
      widget: string
      required: true
    - name: zh
      label: 中文首页
      widget: object
      required: false
      fields:
      - name: identity
        label: 身份说明
        widget: string
        required: false
      - name: lead
        label: 首页大字介绍
        widget: text
        required: false
      - name: introduction
        label: 个人简介
        widget: richtext
        required: false
        format: html
        modes:
        - rich_text
    - name: en
      label: 英文首页
      widget: object
      required: false
      fields:
      - name: identity
        label: 身份说明
        widget: string
        required: false
      - name: lead
        label: 首页大字介绍
        widget: text
        required: false
      - name: introduction
        label: 个人简介
        widget: richtext
        required: false
        format: html
        modes:
        - rich_text
- name: posts
  label: 我的博客
  label_singular: 文章
  folder: content/posts
  create: true
  extension: md
  format: yaml-frontmatter
  slug: '{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
  summary: '{{title}}'
  fields:
  - name: title
    label: 文章标题
    widget: string
    required: true
  - name: date
    label: 发布日期
    widget: datetime
    required: true
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - name: summary
    label: 文章摘要
    widget: text
    required: true
  - name: category
    label: 文章分类
    widget: select
    required: true
    default: essay
    options:
    - value: research
      label: 研究笔记
    - value: essay
      label: 随笔
    - value: reading
      label: 阅读札记
    - value: other
      label: 其他写作
  - name: lang
    label: 文章语言
    widget: select
    required: false
    default: zh
    options:
    - value: zh
      label: 中文
    - value: en
      label: 英文
  - name: draft
    label: 暂存草稿，不显示到网站
    widget: boolean
    required: false
    default: true
    hint: 保存为草稿仍会写入公开仓库，不适合存放私密内容。
  - name: body
    label: 正文
    widget: richtext
    required: false
    format: markdown
    modes:
    - rich_text
- name: books
  label: 书籍
  files:
  - name: books
    label: 书籍
    file: content/books.json
    fields:
    - name: categories
      widget: hidden
      default:
      - id: computing
        name:
          zh: 计算机与人工智能
          en: Computing & AI
        description:
          zh: 计算理论、算法、人工智能与计算系统。
          en: ''
      - id: electronics
        name:
          zh: 微电子与半导体
          en: Microelectronics
        description:
          zh: 器件物理、集成电路、芯片与产业。
          en: ''
      - id: math
        name:
          zh: 数学与统计
          en: Mathematics & statistics
        description:
          zh: 数学方法、概率、统计与因果推断。
          en: ''
      - id: physics
        name:
          zh: 物理与自然科学
          en: Physics & natural science
        description:
          zh: 物理、生物、复杂系统与科学方法。
          en: ''
      - id: economics
        name:
          zh: 经济与金融
          en: Economics & finance
        description:
          zh: 微观、宏观、经济史与金融。
          en: ''
      - id: history
        name:
          zh: 历史与传记
          en: History & biography
        description:
          zh: 人物、制度、技术与历史变化。
          en: ''
      - id: philosophy
        name:
          zh: 哲学与心智
          en: Philosophy & mind
        description:
          zh: 知识、伦理、意识与理性。
          en: ''
      - id: society
        name:
          zh: 社会与政治
          en: Society & politics
        description:
          zh: 社会科学、制度、公共事务与文化。
          en: ''
      - id: literature
        name:
          zh: 文学与艺术
          en: Literature & art
        description:
          zh: 小说、诗歌、艺术、建筑与审美。
          en: ''
      - id: creation
        name:
          zh: 创造与实践
          en: Creation & practice
        description:
          zh: 写作、设计、创业与做事的方法。
          en: ''
      - id: general
        name:
          zh: 综合阅读与资源网站
          en: General reading & resources
        description:
          zh: 跨学科书籍、综合书库与阅读网站。
          en: Cross-disciplinary books and reading websites.
    - name: entries
      label: 书籍与阅读网站
      widget: list
      required: false
      fields:
      - name: title
        label: 名称（书名或网站名）
        widget: string
      - name: category
        label: 学科 / 门类
        widget: select
        default: general
        options:
        - value: computing
          label: 计算机与人工智能
        - value: electronics
          label: 微电子与半导体
        - value: math
          label: 数学与统计
        - value: physics
          label: 物理与自然科学
        - value: economics
          label: 经济与金融
        - value: history
          label: 历史与传记
        - value: philosophy
          label: 哲学与心智
        - value: society
          label: 社会与政治
        - value: literature
          label: 文学与艺术
        - value: creation
          label: 创造与实践
        - value: general
          label: 综合阅读与资源网站
      - name: url
        label: 访问链接
        widget: string
        pattern:
        - ^https?://.+
        - 请粘贴以 https:// 或 http:// 开头的完整链接。
      - name: note
        label: 一句话推荐（可留空）
        widget: text
        required: false
      - name: draft
        label: 暂存草稿，不显示到网站
        widget: boolean
        required: false
        default: false
      collapsed: true
      summary: '{{fields.title}}'
      hint: 填写名称、学科和完整链接；推荐语可留空。综合书库或跨学科网站可选择「综合阅读与资源网站」。
