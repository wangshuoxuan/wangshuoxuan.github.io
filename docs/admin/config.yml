      - id: general
        name:
          zh: 综合阅读与资源网站
          en: General reading & resources
        description:
          zh: 跨学科书籍、综合书库与阅读网站。
          en: Cross-disciplinary books and reading websites.
    - name: entries
      label: 书籍与阅读网站
      widget: list
      required: false
      fields:
      - name: title
        label: 名称（书名或网站名）
        widget: string
      - name: category
        label: 学科 / 门类
        widget: select
        default: general
        options:
        - value: computing
          label: 计算机与人工智能
        - value: electronics
          label: 微电子与半导体
        - value: math
          label: 数学与统计
        - value: physics
          label: 物理与自然科学
        - value: economics
          label: 经济与金融
        - value: history
          label: 历史与传记
        - value: philosophy
          label: 哲学与心智
        - value: society
          label: 社会与政治
        - value: literature
          label: 文学与艺术
        - value: creation
          label: 创造与实践
        - value: general
          label: 综合阅读与资源网站
      - name: url
        label: 访问链接
        widget: string
        pattern:
        - ^https?://.+
        - 请粘贴以 https:// 或 http:// 开头的完整链接。
      - name: note
        label: 一句话推荐（可留空）
        widget: text
        required: false
      - name: draft
        label: 暂存草稿，不显示到网站
        widget: boolean
        required: false
        default: false
      collapsed: true
      summary: '{{fields.title}}'
      hint: 填写名称、学科和完整链接；推荐语可留空。综合书库或跨学科网站可选择「综合阅读与资源网站」。
